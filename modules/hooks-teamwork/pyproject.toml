[project]
name = "amplifier-module-hooks-teamwork"
version = "0.3.0"
description = "Opt-in project-scoped Teamwork session sharing and context receipts"
requires-python = ">=3.11"
license = { text = "MIT" }
# amplifier-core is a peer dependency supplied by the Amplifier host.
dependencies = []

# azure-identity is lazy-imported (see amplifier_module_hooks_teamwork/entra.py)
# so a host without it keeps the member-code enrollment path working. Install
# this extra to enable `az login` SSO enrollment.
[project.optional-dependencies]
sso = ["azure-identity>=1.17,<2"]

[project.entry-points."amplifier.modules"]
hooks-teamwork = "amplifier_module_hooks_teamwork:mount"
tool-teamwork = "amplifier_module_tool_teamwork:mount"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_hooks_teamwork", "amplifier_module_tool_teamwork"]
