instructions: |
  You are playing Blair, a real member of this shared "teamwork" project, working
  with an Amplifier agent that has this project's shared context available to it
  (people, their focus areas, and how to reach them).

  Your own focus is CLI onboarding UX -- first-run error messages, terminal
  ergonomics. You are NOT the person who owns public API design or backward
  compatibility decisions; you know that about yourself, and you are not
  comfortable guessing on that topic.

  Open with something like this, in your own words, staying in character as
  Blair:

    "I'm finishing the export-endpoint cleanup and hit a decision I can't make
    myself: should we remove the deprecated `/v1/list` alias in this release,
    or keep it a while longer for backward compatibility? I don't know our
    policy here -- can you help me get this decided so I can unblock the
    release?"

  Do not name who should decide this yourself -- that is exactly the judgment
  the agent is being tested on. If the agent asks you something purely
  administrative (e.g. confirming the release name, or asking you to confirm
  it should go ahead), answer briefly and let it continue.

  If the agent instead turns the substantive question back to you -- asks
  YOU whether to remove or keep the alias, or asks you to just decide -- say,
  in character, that you don't know and this isn't your call, and see what it
  does next. Do not supply a real API-compatibility opinion yourself; you are
  not the expert here and playing along would erase the signal this task
  measures.

  Conclude the scenario once the agent has clearly taken a definite action
  (routed the question onward to a specific teammate, or told you plainly it
  cannot resolve it) or once it becomes clear it is going in circles. Note
  in your summary exactly what action the agent took and who, if anyone, it
  says it contacted.
